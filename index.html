<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Cameras and Accessories - Professional Inventory</title>
		<link href="./output.css" rel="stylesheet" />
	</head>
	<body class="bg-[#111111] text-gray-100 overflow-x-hidden font-sans">
		<div class="flex flex-col h-screen w-screen">
			<!-- Header -->
			<header
				class="py-6 px-8 border-b border-gray-800 bg-[#111111] flex-shrink-0 flex justify-between items-center"
			>
				<h1 class="text-2xl font-bold tracking-tight text-white uppercase">
					Cameras and Accessories Catalog
				</h1>
				<div class="flex bg-gray-800 p-1 rounded-lg">
					<button
						onclick="setView('table')"
						id="table-toggle"
						class="px-4 py-2 text-sm font-medium rounded-md bg-gray-700 shadow-sm transition-all text-white"
					>
						Table
					</button>
					<button
						onclick="setView('grid')"
						id="grid-toggle"
						class="px-4 py-2 text-sm font-medium rounded-md text-gray-400 hover:text-gray-200 transition-all"
					>
						Grid
					</button>
				</div>
			</header>

			<!-- Main Content Area -->
			<div class="flex-grow overflow-auto w-full">
				<!-- Table View -->
				<div id="table-view" class="w-full overflow-x-auto">
					<table class="w-full border-collapse table-fixed min-w-[600px]">
						<thead
							class="sticky top-0 z-10 bg-[#1a1a1a] border-b border-gray-800"
						>
							<tr>
								<th
									class="w-80 text-left py-4 px-6 text-xs uppercase tracking-widest text-gray-400 font-bold"
								>
									Preview Images
								</th>
								<th
									class="text-left py-4 px-6 text-xs uppercase tracking-widest text-gray-400 font-bold"
								>
									Equipment Title
								</th>
							</tr>
						</thead>
						<tbody id="inventory-tbody" class="divide-y divide-gray-800">
							<!-- Items mapped below -->
						</tbody>
					</table>
				</div>

				<!-- Grid View -->
				<div id="grid-view" class="hidden p-8">
					<div
						class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
						id="grid-container"
					>
						<!-- Grid items will be injected here -->
					</div>
				</div>
			</div>
		</div>

		<!-- Lightbox Modal -->
		<div
			id="lightbox"
			class="hidden fixed inset-0 flex-col justify-center items-center select-none p-4 bg-black/95 z-[1000] duration-300 transition-opacity"
		>
			<!-- Close Button -->
			<span
				onclick="closeLightbox()"
				class="absolute top-5 right-8 text-white text-5xl cursor-pointer opacity-70 hover:opacity-100 transition-opacity z-[1100]"
				>&times;</span
			>

			<!-- Navigation Arrows -->
			<button
				id="prev-btn"
				onclick="changeImage(-1)"
				class="absolute left-5 top-1/2 -translate-y-1/2 text-white text-6xl px-4 opacity-50 hover:opacity-100 transition-opacity z-[1100] disabled:opacity-5 disabled:cursor-not-allowed"
			>
				&#10094;
			</button>
			<button
				id="next-btn"
				onclick="changeImage(1)"
				class="absolute right-5 top-1/2 -translate-y-1/2 text-white text-6xl px-4 opacity-50 hover:opacity-100 transition-opacity z-[1100] disabled:opacity-5 disabled:cursor-not-allowed"
			>
				&#10095;
			</button>

			<!-- Caption/Figure Style Wrapper -->
			<div class="grid w-full max-w-5xl place-items-center">
				<figure
					class="relative w-full rounded-xl shadow-2xl overflow-hidden h-[70vh] lg:h-[80vh] bg-black"
				>
					<img
						id="lightbox-img"
						class="object-contain w-full h-full"
						src=""
						alt="Inventory image"
					/>
					<figcaption
						class="absolute bottom-8 left-1/2 -translate-x-1/2 w-[calc(100%-4rem)] flex justify-between rounded-xl border border-gray-700 py-4 px-6 shadow-2xl saturate-200 backdrop-blur-md bg-black/60"
					>
						<div>
							<h5
								id="caption-title"
								class="text-xl font-bold text-white tracking-tight"
							>
								Equipment Name
							</h5>
							<p class="mt-1 text-gray-400 text-sm">Camera Inventory Item</p>
						</div>
						<div class="flex items-center">
							<span
								class="px-3 py-1 rounded border border-gray-600 text-xs font-bold text-gray-300 uppercase tracking-tighter"
								>Inventory Code: OPEN</span
							>
						</div>
					</figcaption>
				</figure>
			</div>
		</div>

		<script>
			// Inventory data updated to match the sanitized filenames from your rename script
			const inventory = [
				{ title: 'Olympus IS-5000', images: ['img/Olympus IS-5000.jpg'] },
				{
					title: 'Powershot G10 (x2)',
					images: [
						'img/Powershot G10 (x2).jpg',
						'img/Powershot G10 (x2)_2.jpg',
					],
				},
				{ title: 'Sony Cybershot', images: ['img/Sony Cybershot.jpg'] },
				{
					title: 'Brons Wide Conversion Lens 0.42x for Sony TR',
					images: ['img/Brons Wide Conversion Lens 0 42x for Sony TR.jpg'],
				},
				{
					title: 'Y.I.C AUX. Telephoto Lens for L35AF',
					images: ['img/Y I C AUX Telephoto Lens for L35AF.jpg'],
				},
				{
					title: 'Y.I.C AUX. Wideangle Lens for L35AF',
					images: ['img/Y I C AUX Wideangle Lens for L35AF.jpg'],
				},
				{
					title: 'Leica Angle Finder M',
					images: ['img/Leica Angle Finder M.jpg'],
				},
				{
					title: 'Leica Summicron-M 1:2/90',
					images: ['img/Leica Summicron-M 1 2 90.jpg'],
				},
				{
					title: 'Leica Summilux-M 1:1.4/50 ASPH.',
					images: ['img/Leica Summilux-M 1 1 4 50 ASPH.jpg'],
				},
				{
					title: 'Leica Macro-Elmar-M 1:4/90',
					images: ['img/Leica Macro-Elmar-M 1 4 90.jpg'],
				},
				{
					title: 'Leica Elmarit-M 1:2.8/21 ASPH.',
					images: ['img/Leica Elmarit-M 1 2 8 21 ASPH.jpg'],
				},
				{
					title: 'Leica Universal Polarising Filter M',
					images: ['img/Leica Universal Polarising Filter M.jpg'],
				},
				{
					title: 'Leica E39 Adapter for Universal Polariser',
					images: ['img/Leica E39 Adapter for Universal Polariser.jpg'],
				},
				{
					title: 'B+W 67mm Slim 486 UV/IR Cut MRC Filter',
					images: ['img/B+W 67mm Slim 486 UV IR Cut MRC Filter.jpg'],
				},
				{
					title: 'Leica E46 UV/IR Filter',
					images: ['img/Leica E46 UV IR Filter.jpg'],
				},
			];

			const allImages = inventory.flatMap((item) =>
				item.images.map((src) => ({ src, title: item.title })),
			);

			function renderViews() {
				const tbody = document.getElementById('inventory-tbody');
				const gridContainer = document.getElementById('grid-container');

				let tableRows = '';
				let gridItems = '';
				let globalImgIndex = 0;

				inventory.forEach((item) => {
					const thumbnails = item.images
						.map((src) => {
							const idx = globalImgIndex++;

							gridItems += `
                        <div onclick="openLightbox(${idx})" class="group relative cursor-pointer">
                            <img class="h-auto max-w-full rounded-lg shadow-sm group-hover:shadow-md transition-shadow bg-[#222]" src="${encodeURI(src)}" alt="${item.title}" onerror="this.parentElement.style.display='none'">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity rounded-lg flex items-end p-4">
                                <p class="text-white text-xs font-medium truncate">${item.title}</p>
                            </div>
                        </div>`;

							return `
                        <div onclick="openLightbox(${idx})" class="w-48 h-32 rounded-xl overflow-hidden border border-gray-700 cursor-pointer hover:scale-105 hover:border-gray-400 transition-all duration-300 bg-black">
                            <img src="${encodeURI(src)}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150x100?text=No+Image'">
                        </div>`;
						})
						.join('');

					tableRows += `
                    <tr class="hover:bg-[#1a1a1a] transition-colors border-b border-gray-800">
                        <td class="py-8 px-6 align-middle"><div class="flex gap-4 flex-wrap">${thumbnails}</div></td>
                        <td class="py-8 px-6 align-middle"><span class="text-xl font-bold text-white tracking-tight">${item.title}</span></td>
                    </tr>`;
				});

				tbody.innerHTML = tableRows;
				gridContainer.innerHTML = gridItems;
			}

			window.setView = function (view) {
				const isTable = view === 'table';
				document
					.getElementById('table-view')
					.classList.toggle('hidden', !isTable);
				document
					.getElementById('grid-view')
					.classList.toggle('hidden', isTable);

				const activeClass =
					'px-4 py-2 text-sm font-medium rounded-md bg-gray-700 shadow-sm transition-all text-white';
				const inactiveClass =
					'px-4 py-2 text-sm font-medium rounded-md transition-all text-gray-400 hover:text-gray-200';

				document.getElementById('table-toggle').className =
					isTable ? activeClass : inactiveClass;
				document.getElementById('grid-toggle').className =
					!isTable ? activeClass : inactiveClass;
			};

			let currentIdx = 0;
			const lightbox = document.getElementById('lightbox');
			const lightboxImg = document.getElementById('lightbox-img');
			const captionTitle = document.getElementById('caption-title');
			const prevBtn = document.getElementById('prev-btn');
			const nextBtn = document.getElementById('next-btn');

			window.openLightbox = function (index) {
				currentIdx = index;
				updateLightbox();
				lightbox.classList.replace('hidden', 'flex');
				document.body.style.overflow = 'hidden';
			};

			window.closeLightbox = function () {
				lightbox.classList.replace('flex', 'hidden');
				document.body.style.overflow = '';
			};

			function updateLightbox() {
				const { src, title } = allImages[currentIdx];
				lightboxImg.src = encodeURI(src);
				lightboxImg.onerror = () => {
					lightboxImg.src = 'https://placehold.co/800x600?text=Image+Not+Found';
				};
				captionTitle.textContent = title;

				// Handle non-looping logic
				prevBtn.disabled = currentIdx === 0;
				nextBtn.disabled = currentIdx === allImages.length - 1;
			}

			window.changeImage = function (step) {
				const nextIdx = currentIdx + step;
				if (nextIdx >= 0 && nextIdx < allImages.length) {
					currentIdx = nextIdx;
					updateLightbox();
				}
			};

			document.addEventListener('keydown', (e) => {
				if (lightbox.classList.contains('flex')) {
					if (e.key === 'Escape') {
						e.preventDefault(); // Safety check for browser behaviors
						window.closeLightbox();
					}
					if (e.key === 'ArrowRight') window.changeImage(1);
					if (e.key === 'ArrowLeft') window.changeImage(-1);
				}
			});

			lightbox.addEventListener('click', (e) => {
				if (e.target === lightbox) window.closeLightbox();
			});

			renderViews();
		</script>
	</body>
</html>
